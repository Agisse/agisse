version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      all: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      # These hang every auth route in `npm run dev` (#39). Drop once a fixed release exists.
      - dependency-name: wrangler
        versions: ["4.150.x"]
      - dependency-name: "@cloudflare/vite-plugin"
        versions: ["1.63.2"]
      # babel-plugin-react-compiler 1.0 skips every component with a defaulted prop under Babel 8 (#49).
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
