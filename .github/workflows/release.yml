name: Release

# Push a tag like v0.1.0 whose section exists in CHANGELOG.md; the release gets that section as notes
# and the browser extension as a zip.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/ { on = index($0, "## [" v "]") == 1; next } on && !/^\[[^]]*\]: /' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }
      - name: Extension zip
        run: cd extension && zip -qr "../agisse-extension-$GITHUB_REF_NAME.zip" .
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "agisse-extension-$GITHUB_REF_NAME.zip" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
